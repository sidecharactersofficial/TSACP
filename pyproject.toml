[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tascp-eval"
version = "0.1.0"
description = "Empirical validation of the TASCP defense for DNN-based NIDS."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Anonymous Authors" }] # No co-authors — double-blind review artifact
# Pinned to the exact environment on which the archived results were produced.
# Kept in sync with requirements.txt (the canonical reproduction manifest).
dependencies = [
    "torch==2.9.1",
    "numpy==2.4.0",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "scipy==1.16.3",
    "scikit-learn==1.8.0",
    "xgboost==3.3.0",
    "joblib==1.5.3",
    "PyYAML==6.0.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tascp_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
