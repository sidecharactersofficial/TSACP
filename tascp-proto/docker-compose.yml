version: '3.8'

services:
  fast-loop:
    build: 
      context: ./fast-loop
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - db-data:/data

  slow-loop:
    build:
      context: ./slow-loop
      dockerfile: Dockerfile
    volumes:
      - db-data:/data
    depends_on:
      - fast-loop

volumes:
  db-data:
