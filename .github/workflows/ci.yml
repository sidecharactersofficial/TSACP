name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install artifact package
        run: pip install -e . --no-deps

      - name: Verify environment pins
        run: python scripts/verify_environment.py

      - name: Checkpoint integrity (SHA-256 manifest)
        run: python verification/verify_manifest.py

      - name: Traceability of archived results
        run: python scripts/check_traceability.py

      - name: Test suite
        run: python -m pytest tests/ -q

  discrepancy:
    # Regenerates the archived headline numbers (exp5/exp8 are seeded and
    # deterministic) and fails if they drift from the shipped records.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Reproduce exp5/exp8 and compare to archive
        run: |
          if [ ! -f data/processed/unsw_nb15/unsw_nb15_processed.parquet ]; then
            echo "preprocessed dataset not present in checkout; skipping discrepancy job"
            echo "(datasets are redistributed via dataset_links.md, not committed)"
            exit 0
          fi
          cp results/logs/exp5_adaptive_bpda_attack/metrics_unsw_nb15.json /tmp/exp5_archive.json
          cp results/logs/exp8_adaptive_ablations/metrics_unsw_nb15.json /tmp/exp8_archive.json
          python -m experiments.exp5_adaptive_bpda_attack.run unsw_nb15 --n 2000 --seed 42
          python -m experiments.exp8_adaptive_ablations.run  unsw_nb15 --n 2000 --seed 42
          python verification/compare_results.py /tmp/exp5_archive.json results/logs/exp5_adaptive_bpda_attack/metrics_unsw_nb15.json
          python verification/compare_results.py /tmp/exp8_archive.json results/logs/exp8_adaptive_ablations/metrics_unsw_nb15.json
